[project]
name = "04-proyecto-final"
version = "0.1.0"
description = "Búsqueda semántica y análisis de productos Amazon mediante MCP por HTTP local"
readme = "README.md"
authors = [
    { name = "Alondra Matos", email = "152126153+AlondraMM@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "numpy>=2.5.4",
    "pydantic>=2,<3",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pandas>=3.1.0",
]
