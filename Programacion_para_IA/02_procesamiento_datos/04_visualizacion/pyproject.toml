dependencies = ["matplotlib>=3.10,<4", "numpy>=2.2,<3", "pandas>=2.2,<4"]

[dependency-groups]
dev = ["ipykernel>=6,<8", "nbconvert>=7,<8", "pip>=25,<27"]
