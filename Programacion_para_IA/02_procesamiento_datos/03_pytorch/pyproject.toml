[project]
name = "pytorch-data-lab"
version = "0.1.0"
description = "Explore tensors and CIFAR-10 batches with PyTorch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2,<3",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "pillow>=11,<13",
    "sentence-transformers>=6.1,<7",
]

[dependency-groups]
dev = ["ipykernel>=6,<8", "nbconvert>=7,<8", "pip>=25,<27", "pytest>=8,<10", "ruff>=0.16,<0.18"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
