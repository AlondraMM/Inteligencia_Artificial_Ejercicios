# Custom 4x4 Wumpus world for exercise 01.
# (1, 1) is the bottom-left cave. Coordinates are 1-based.

grid:
  width: 4
  height: 4

agent:
  start: [1, 1]
  direction: east
  arrows: 1

wumpus: [4, 2]

pits:
  - [4, 1]
  - [2, 4]
  - [4, 3]

gold: [2, 3]

scoring:
  gold: 1000
  death: -1000
  step: -1
  shoot: -10

max_steps: 200
